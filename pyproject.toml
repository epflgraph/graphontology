[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphontology"
version = "0.0.1"
authors = [
  { name="Ramtin Yazdanian", email="ramtin.yazdanian@epfl.ch" }
]
description = "Tools for GraphOntology (part of EPFLGraph)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy",
    "questionary",
    "db-cache-manager",
    "elasticsearch-interface>=0.11.0",
    "typer",
    # Git dependency (PEP 508 syntax)
    "graphdb-client @ git+https://github.com/epflgraph/graphdb-client.git",
    "graphes-client @ git+https://github.com/epflgraph/graphes-client.git",
]

[tool.setuptools]
packages = ["graphontology"]

[project.scripts]
graphontology = "graphontology.cli:app"
